<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090b;--surface:#0e0e10;--border:#1c1c20;--text:#a1a1aa;--text-dim:#52525b;--white:#f4f4f5;--font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;-webkit-font-smoothing:antialiased;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:24px 24px;text-align:center}

.brand img{height:42px;width:auto;border-radius:4px}
.code{font-size:5rem;font-weight:700;color:var(--white);letter-spacing:-.04em;line-height:1;margin-bottom:.5rem}
.code span{color:var(--text-dim)}
h1{font-size:1.4rem;font-weight:600;color:var(--white);margin-bottom:.6rem;letter-spacing:-.01em}
p{font-size:1rem;line-height:1.6;margin-bottom:2rem}
.btn{display:inline-block;padding:.7rem 1.5rem;background:var(--white);color:var(--bg);border-radius:6px;font-weight:600;font-size:.95rem;text-decoration:none;transition:opacity .15s}
.btn:hover{opacity:.9}
.links{margin-top:1.8rem;font-size:.85rem}
.links a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px;margin:0 .5rem}
.links a:hover{color:var(--white)}
</style>
</head>
<body>
